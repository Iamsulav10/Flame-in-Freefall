[browser]
gatherUsageStats = false

[client]
showErrorDetails = "none"
toolbarMode = "minimal"

[server]
enableCORS = true
enableXsrfProtection = true
xsrfCookieSameSite = "lax"
maxMessageSize = 5
maxUploadSize = 1

[theme]
base = "light"
primaryColor = "#9F3517"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F7"
textColor = "#172B3A"
font = "sans-serif"
